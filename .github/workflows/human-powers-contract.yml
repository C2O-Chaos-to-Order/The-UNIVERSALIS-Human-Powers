name: Human Powers Contract Validation
on:
  push:
    paths:
      - "schemas/human-powers/**"
      - "examples/human_powers/**"
      - ".github/scripts/human_powers_contract.py"
      - ".github/workflows/human-powers-contract.yml"
  pull_request:
    paths:
      - "schemas/human-powers/**"
      - "examples/human_powers/**"
      - ".github/scripts/human_powers_contract.py"
      - ".github/workflows/human-powers-contract.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Validate public human-authority contracts
        run: python .github/scripts/human_powers_contract.py
